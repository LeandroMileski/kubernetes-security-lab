#cloud-config
package_update: true
package_upgrade: false

ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMQdu261PQdAFOJ5Bfo0WjIN/V+uSUVB3GlHHDHazDA3 cks-lab

bootcmd:
  # 1. Purge potentially unstable hypervisor-bound DNS links
  - rm -f /etc/resolv.conf
  - echo "nameserver 1.1.1.1" > /etc/resolv.conf
  - echo "nameserver 8.8.8.8" >> /etc/resolv.conf

write_files:
  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

runcmd:
  # 2. Prevent race conditions: Wait until a true global IP and route exist
  - until ping -c 1 1.1.1.1; do sleep 2; done
  
  # 3. Load critical networking parameters 
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system
  
  # 4. Extract primary interface IP dynamically to avoid default fallback blocks
  - PRIMARY_IP=$(ip route get 1.1.1.1 | awk '{print $7; exit}')
  
  # 5. Initialize Kubeadm targeting the verified physical routing interface
  - kubeadm init --apiserver-advertise-address=$PRIMARY_IP --pod-network-cidr=10.244.0.0/16 --kubernetes-version=v1.34.11
